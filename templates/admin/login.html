{% extends "base.html" %}

{% block title %}AURA | Admin Security Access{% endblock %}

{% block content %}
<section class="pt-32 pb-20 max-w-md mx-auto px-6">
    <div class="glass-panel p-8 rounded-3xl border border-gold-500/30 space-y-6 shadow-2xl relative overflow-hidden">
        <!-- Accent Glow -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-gold-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-gold-600 to-amber-300 mx-auto flex items-center justify-center text-obsidian-900 font-serif font-bold text-2xl shadow-lg">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h1 class="text-2xl font-serif font-bold text-white tracking-tight">Admin System Access</h1>
            <p class="text-xs text-gray-400">Authenticate to access product catalog controls and store administration.</p>
        </div>

        <form method="POST" action="{{ url_for('admin_login', next=request.args.get('next')) }}" class="space-y-4">
            <div class="space-y-1">
                <label for="username" class="text-xs uppercase tracking-widest text-gold-400 font-semibold block">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 text-xs">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" name="username" required placeholder="admin" class="w-full pl-9 pr-4 py-3 bg-obsidian-900 border border-white/10 rounded-xl text-xs text-white placeholder-gray-500 focus:outline-none focus:border-gold-500">
                </div>
            </div>

            <div class="space-y-1">
                <label for="password" class="text-xs uppercase tracking-widest text-gold-400 font-semibold block">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 text-xs">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full pl-9 pr-4 py-3 bg-obsidian-900 border border-white/10 rounded-xl text-xs text-white placeholder-gray-500 focus:outline-none focus:border-gold-500">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-gold-500 to-amber-600 hover:brightness-110 text-obsidian-900 font-bold text-xs uppercase tracking-widest transition-all shadow-lg shadow-gold-500/20 flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Log In To System</span>
            </button>
        </form>

        <div class="pt-4 border-t border-white/10 text-center text-[11px] text-gray-500">
            <span>AURA Haute Parfumerie &bull; Secure Portal</span>
        </div>
    </div>
</section>
{% endblock %}
